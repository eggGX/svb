<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>環境選択</title>
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>
  <h1>環境選択</h1>
  <p class="hint">使用する環境を選択してください。選択した環境ごとにデッキ・BO1データ・戦績が分かれます。</p>

  <div id="migrationNotice" class="migration-notice" style="display:none;"></div>
  <div id="environmentList" class="environment-list"></div>

  <div class="new-deck">
    <button onclick="location.href='index.html'">TOPへ戻る</button>
  </div>

  <script src="js/environment_loader.js"></script>
  <script>
    init();

    async function init() {
      const data = await EnvironmentLoader.ensureFileEnvironments();
      const environments = data.environments || [];
      const container = document.getElementById('environmentList');
      const migrationNotice = document.getElementById('migrationNotice');

      if (EnvironmentLoader.hasUnassignedData(data)) {
        migrationNotice.style.display = 'block';
        migrationNotice.innerHTML = `
          <strong>環境未設定の既存データがあります。</strong>
          <span>以前から使っていたデッキ・戦績を環境に割り当てできます。</span>
          <button type="button" onclick="location.href='environment_migration.html'">既存データを環境に移行</button>
        `;
      }

      if (environments.length === 0) {
        container.innerHTML = '<p>登録された環境がありません。先に environment_register.html から環境を登録してください。</p>';
        return;
      }

      environments.forEach(env => {
        const card = document.createElement('div');
        card.className = 'deck environment-select-card';
        card.innerHTML = `
          <button class="environment-image-button" type="button" onclick="selectEnvironment('${escapeJs(env.id)}')" aria-label="${escapeHtml(env.title)}でスタート">
            ${env.image ? `<img src="${escapeAttr(env.image)}" alt="${escapeHtml(env.title)}">` : '<span class="no-image">NO IMAGE</span>'}
          </button>
          <h3 class="deck-title environment-title-only">${escapeHtml(env.title)}</h3>
        `;
        container.appendChild(card);
      });
    }

    function selectEnvironment(id) {
      const latest = EnvironmentLoader.readData();
      latest.currentEnvironmentId = id;
      delete latest.selectedDeckId;
      EnvironmentLoader.writeData(latest);
      location.href = 'deck_select.html';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }
    function escapeJs(value) {
      return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
