<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デッキ登録</title>
  <link rel="stylesheet" href="style/style.css" />
  <style>
    .class-buttons{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:10px 0 22px}.class-buttons h3{width:100%}#classButtons{display:flex;flex-wrap:wrap;gap:14px}
    #classButtons button{width:88px;height:74px;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:18px;overflow:hidden}#classButtons img{width:58px;height:58px;object-fit:contain}
    .deck-source-tabs{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 16px}.deck-source-tabs button.active{outline:3px solid rgba(80,190,255,.65)}
    #urlPanel[hidden],#builderPanel[hidden]{display:none!important}
    .builder-card{margin:14px 0;padding:16px;border:1px solid rgba(233,199,106,.45);border-radius:16px;background:linear-gradient(180deg,rgba(22,29,72,.88),rgba(8,12,30,.88));box-shadow:0 0 18px rgba(233,199,106,.12)}
    .builder-card.ready{border-color:rgba(126,235,165,.7)}.builder-card strong{display:block;margin-bottom:8px}.builder-card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    @media(max-width:560px){#classButtons button{width:72px;height:64px}#classButtons img{width:46px;height:46px}}
  </style>
</head>
<body>
  <h1>デッキ登録</h1>

  <div class="class-buttons">
    <h3>クラス選択</h3>
    <div id="classButtons"></div>
  </div>

  <div>
    <h3>デッキ名</h3>
    <input type="text" id="deckName" placeholder="例: ミッドレンジロイヤル" />

    <h3>登録方法</h3>
    <div class="deck-source-tabs">
      <button type="button" id="urlTab" class="active">画像URLで登録</button>
      <button type="button" id="builderTab">デッキ作成</button>
    </div>

    <section id="urlPanel">
      <h3>デッキ画像URL</h3>
      <div style="margin-top:20px">
        <button type="button" onclick="window.open('https://shadowverse-wb.com/ja/deck/build/')">公式デッキ作成はこちら</button>
      </div>
      <input type="text" id="deckUrl" placeholder="画像のURLを入力してください" />
      <div id="imagePreview"></div>
    </section>

    <section id="builderPanel" hidden>
      <div id="builderCard" class="builder-card">
        <strong id="builderSummary">まだデッキが作成されていません。</strong>
        <span>カードDBの情報を使って、同一カード3枚まで・合計40枚でデッキを作成します。</span>
        <div class="actions">
          <button type="button" id="openBuilderButton">デッキ作成画面を開く</button>
          <button type="button" id="clearBuilderButton">作成内容をクリア</button>
        </div>
      </div>
    </section>

    <h3>メモ</h3>
    <textarea id="deckMemo" rows="4" placeholder="自由記述欄"></textarea>
  </div>

  <button type="button" id="registerDeckButton">デッキを登録</button>
  <button type="button" onclick="goToSelect()">デッキ選択へ</button>

  <script>
    const DRAFT_KEY='shadowverseDeckRegisterDraft';
    const BUILD_KEY='shadowverseDeckBuildDraft';
    const COMPLETE_KEY='shadowverseDeckBuildCompleted';

    const initialData=JSON.parse(localStorage.getItem('shadowverseData')||'{}');
    const currentEnvironmentId=initialData.currentEnvironmentId;
    const currentEnvironment=(initialData.environments||[]).find(e=>e.id===currentEnvironmentId);
    if(!currentEnvironmentId||!currentEnvironment){
      alert('環境が選択されていません。環境選択画面に戻ります。');
      location.href='environment_select.html';
    }

    const classIcons={'エルフ':'images/elf.svg','ロイヤル':'images/royal.svg','ウィッチ':'images/witch.svg','ドラゴン':'images/dragon.svg','ナイトメア':'images/nightmare.svg','ビショップ':'images/bishop.svg','ネメシス':'images/nemesis.svg'};
    let selectedClass=null;
    let registrationMode='url';

    const classButtons=document.getElementById('classButtons');
    const deckName=document.getElementById('deckName');
    const deckUrl=document.getElementById('deckUrl');
    const deckMemo=document.getElementById('deckMemo');
    const imagePreview=document.getElementById('imagePreview');
    const urlTab=document.getElementById('urlTab');
    const builderTab=document.getElementById('builderTab');
    const urlPanel=document.getElementById('urlPanel');
    const builderPanel=document.getElementById('builderPanel');
    const builderCard=document.getElementById('builderCard');
    const builderSummary=document.getElementById('builderSummary');

    Object.entries(classIcons).forEach(([cls,path])=>{
      const btn=document.createElement('button'); btn.type='button';
      btn.innerHTML=`<img src="${path}" alt="${cls}" title="${cls}">`;
      btn.addEventListener('click',()=>selectClass(cls,btn));
      classButtons.appendChild(btn);
    });

    restoreDraft();
    updateBuilderSummary();
    updateImage();

    urlTab.addEventListener('click',()=>setMode('url'));
    builderTab.addEventListener('click',()=>{
      setMode('builder');
      openBuilder();
    });
    document.getElementById('openBuilderButton').addEventListener('click',openBuilder);
    document.getElementById('clearBuilderButton').addEventListener('click',()=>{
      if(!confirm('作成中のデッキ内容をクリアしますか？')) return;
      sessionStorage.removeItem(BUILD_KEY);
      sessionStorage.removeItem(COMPLETE_KEY);
      updateBuilderSummary();
    });
    deckUrl.addEventListener('input',updateImage);
    document.getElementById('registerDeckButton').addEventListener('click',registerDeck);

    function selectClass(cls,btn){
      selectedClass=cls;
      [...classButtons.children].forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function setMode(mode){
      registrationMode=mode;
      const isUrl=mode==='url';
      urlPanel.hidden=!isUrl;
      builderPanel.hidden=isUrl;
      urlTab.classList.toggle('active',isUrl);
      builderTab.classList.toggle('active',!isUrl);
    }

    function saveDraft(){
      sessionStorage.setItem(DRAFT_KEY,JSON.stringify({
        className:selectedClass,
        name:deckName.value.trim(),
        url:deckUrl.value.trim(),
        memo:deckMemo.value,
        mode:'builder'
      }));
    }

    function restoreDraft(){
      const draft=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'null');
      if(!draft) return;
      if(draft.name!=null) deckName.value=draft.name;
      if(draft.url!=null) deckUrl.value=draft.url;
      if(draft.memo!=null) deckMemo.value=draft.memo;
      if(draft.className){
        const entries=[...classButtons.children];
        const idx=Object.keys(classIcons).indexOf(draft.className);
        if(idx>=0) selectClass(draft.className,entries[idx]);
      }
      if(draft.mode==='builder'||sessionStorage.getItem(COMPLETE_KEY)==='1') setMode('builder');
    }

    function openBuilder(){
      if(!selectedClass){ alert('先にクラスを選択してください。'); return; }
      saveDraft();
      location.href='deck_builder.html';
    }

    function updateBuilderSummary(){
      const selected=JSON.parse(sessionStorage.getItem(BUILD_KEY)||'{}');
      const total=Object.values(selected).reduce((s,n)=>s+n,0);
      const completed=sessionStorage.getItem(COMPLETE_KEY)==='1'&&total===40;
      builderSummary.textContent=completed?'40枚のデッキを作成済みです。':total?`${total} / 40枚 選択中です。`:'まだデッキが作成されていません。';
      builderCard.classList.toggle('ready',completed);
    }

    function updateImage(){
      const url=deckUrl.value.trim(); imagePreview.innerHTML='';
      if(!url) return;
      const img=document.createElement('img'); img.src=url; img.alt='デッキ画像プレビュー'; imagePreview.appendChild(img);
    }

    function registerDeck(){
      const name=deckName.value.trim();
      const url=deckUrl.value.trim();
      const memo=deckMemo.value.trim();
      if(!selectedClass||!name){ alert('クラスとデッキ名は必須です'); return; }

      let cards=[];
      if(registrationMode==='builder'){
        const map=JSON.parse(sessionStorage.getItem(BUILD_KEY)||'{}');
        const total=Object.values(map).reduce((s,n)=>s+n,0);
        if(total!==40||sessionStorage.getItem(COMPLETE_KEY)!=='1'){
          alert('デッキ作成画面で40枚のデッキを完成させてください。'); return;
        }
        cards=Object.entries(map).map(([cardId,count])=>({cardId,count}));
      }

      const data=JSON.parse(localStorage.getItem('shadowverseData')||'{}');
      if(!data.decks) data.decks=[];
      const id='deck-'+Date.now();
      data.decks.push({
        id,
        environmentId:currentEnvironmentId,
        class:selectedClass,
        name,
        url:registrationMode==='url'?url:'',
        memo,
        records:[],
        deckType:registrationMode==='builder'?'builder':'image',
        cards
      });
      data.selectedDeckId=id;
      localStorage.setItem('shadowverseData',JSON.stringify(data));
      sessionStorage.removeItem(DRAFT_KEY);
      sessionStorage.removeItem(BUILD_KEY);
      sessionStorage.removeItem(COMPLETE_KEY);
      location.href='deck_select.html';
    }

    function goToSelect(){ location.href='deck_select.html'; }
  </script>
</body>
</html>
