<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マリガン研究</title><link rel="stylesheet" href="style/style.css"><style>
.wrap{width:min(1450px,calc(100% - 30px));margin:auto}.top,.tabs,.row,.class-buttons,.data-filters{display:flex;gap:12px;flex-wrap:wrap}.top{justify-content:space-between;align-items:center}.panel{background:rgba(10,18,48,.94);border:1px solid #9b8247;border-radius:14px;padding:18px;margin:14px 0}.tabs button.active{outline:2px solid #e9c76a}.field{flex:1;min-width:210px}.field select{width:100%}.class-button{width:82px;height:70px;padding:6px;background:#081024;border:2px solid #3f527f;border-radius:12px;cursor:pointer}.class-button img{width:54px;height:54px;object-fit:contain}.class-button.selected{border-color:#71df9a;box-shadow:0 0 12px #71df9a}.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.slot{min-height:170px;border:1px dashed #6f85bd;border-radius:4px;padding:8px;text-align:center;cursor:pointer;background:#081024}.slot img{width:100%;max-height:240px;object-fit:contain;border-radius:0!important}.slot.return{outline:3px solid #ff4d5f;background:rgba(160,35,50,.22);box-shadow:0 0 12px rgba(255,77,95,.45)}.slot.return>div{color:#ff7a87;font-weight:700}.deckpicker{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;max-height:520px;overflow:auto;margin-top:12px}.pick{position:relative;background:#081024;border:1px solid #5573ad;border-radius:4px!important;padding:5px;cursor:pointer;color:#fff;overflow:hidden}.pick:disabled{opacity:.35}.pick img{width:100%;height:auto;display:block;border-radius:0!important;object-fit:contain}.pick span{display:block;font-size:.78rem;text-align:center;color:#fff}.badge{position:absolute;right:5px;top:5px;background:#050914;border:1px solid #e9c76a;padding:2px 6px}.rank{display:grid;grid-template-columns:52px 54px minmax(180px,1fr) 110px 110px;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #26345e}.rank img,.pair-row img{width:48px;height:66px;object-fit:contain;border-radius:0!important}.pair-row{display:grid;grid-template-columns:54px minmax(180px,1fr) 90px;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #26345e}.data-filters{align-items:end}.data-filter{min-width:210px;flex:0 1 300px}.data-filter select{width:100%}.filter-summary{margin-left:auto;font-weight:700}.muted{opacity:.75}.hidden{display:none!important}@media(max-width:900px){.deckpicker{grid-template-columns:repeat(5,1fr)}.hand{grid-template-columns:repeat(2,1fr)}.filter-summary{margin-left:0;width:100%}}
</style></head><body><div class="wrap"><div class="top"><div><h1>マリガン研究</h1><div id="deckName"></div></div><button onclick="location.href='battle.html'">戦績登録へ戻る</button></div><div class="tabs"><button id="entryTab" class="active">マリガン登録</button><button id="resultTab">マリガンデータ</button></div>
<section id="entry"><div class="panel"><div class="row"><div class="field"><h3>対面のクラス</h3><div id="oppButtons" class="class-buttons"><button class="class-button" data-class="エルフ"><img src="images/elf.svg" alt="エルフ"></button><button class="class-button" data-class="ロイヤル"><img src="images/royal.svg" alt="ロイヤル"></button><button class="class-button" data-class="ウィッチ"><img src="images/witch.svg" alt="ウィッチ"></button><button class="class-button" data-class="ドラゴン"><img src="images/dragon.svg" alt="ドラゴン"></button><button class="class-button" data-class="ナイトメア"><img src="images/nightmare.svg" alt="ナイトメア"></button><button class="class-button" data-class="ビショップ"><img src="images/bishop.svg" alt="ビショップ"></button><button class="class-button" data-class="ネメシス"><img src="images/nemesis.svg" alt="ネメシス"></button></div></div><div class="field"><h3>先攻 / 後攻</h3><select id="first"><option value="">選択してください</option><option value="first">先攻</option><option value="second">後攻</option></select><h3>勝敗（任意）</h3><select id="win"><option value="">未入力</option><option value="win">勝ち</option><option value="lose">負け</option></select></div></div></div>
<div class="panel"><h2>初期手札 4枚</h2><p class="muted">下のデッキから4枚選択します。返すカードをクリックして選択してください。返すカードには赤枠が付きます。右クリックで手札から外せます。</p><div id="hand" class="hand"></div></div><div class="panel"><h2>デッキ内カード</h2><input id="search" placeholder="カード名で検索"><div id="picker" class="deckpicker"></div></div><button id="save">このマリガンを登録</button><div id="history" class="panel"></div></section>
<section id="results" class="hidden"><div class="panel"><h2>表示条件</h2><div class="data-filters"><div class="data-filter"><label for="dataOpponent">対面クラス</label><select id="dataOpponent"><option value="">全クラス</option><option>エルフ</option><option>ロイヤル</option><option>ウィッチ</option><option>ドラゴン</option><option>ナイトメア</option><option>ビショップ</option><option>ネメシス</option></select></div><div class="data-filter"><label for="dataFirst">先攻 / 後攻</label><select id="dataFirst"><option value="">両方</option><option value="first">先攻</option><option value="second">後攻</option></select></div><div id="filterSummary" class="filter-summary"></div></div></div><div class="panel"><h2>キープ率</h2><p class="muted">初期手札に来た回数に対して、そのカードをキープした割合です。</p><div id="ranking"></div></div><div class="panel"><h2>勝利時キープ率</h2><div id="winRanking"></div></div><div class="panel"><h2>カード別・一緒にキープされるカード</h2><select id="pairCard"></select><div id="pairs"></div></div></section></div><script src="js/card_deck.js"></script><script>
const data=JSON.parse(localStorage.getItem('shadowverseData')||'{}'),deck=(data.decks||[]).find(d=>d.id===data.selectedDeckId&&d.environmentId===data.currentEnvironmentId);if(!deck||deck.deckType!=='builder'||!Array.isArray(deck.cards)){alert('マリガン研究はデッキ作成機能で登録したデッキのみ利用できます。');location.href='battle.html'}
const KEY='shadowverseMulliganResearchV1';let store=JSON.parse(localStorage.getItem(KEY)||'{}'),records=store[deck.id]||[],cards=[],byId={},hand=[],selectedOpponent='';deckName.textContent=deck.name||'選択中のデッキ';
document.querySelectorAll('#oppButtons .class-button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#oppButtons .class-button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');selectedOpponent=btn.dataset.class});
async function init(){const loaded=await CardDeckAPI.loadCards();byId=Object.fromEntries(loaded.cards.map(c=>[c.id,c]));cards=deck.cards.map(x=>({...(byId[x.cardId]||{id:x.cardId,name:x.cardId}),deckCount:Number(x.count)||0})).filter(c=>c.deckCount);renderHand();renderPicker();renderHistory();renderResults()}
function img(c){return CardDeckAPI.cardImage(c)}function handCount(id){return hand.filter(x=>x.id===id).length}function renderHand(){const handEl=document.getElementById('hand');handEl.innerHTML='';for(let i=0;i<4;i++){const x=hand[i],s=document.createElement('div');s.className='slot'+(x?.return?' return':'');if(x){const c=byId[x.id]||x;s.innerHTML=`<img src="${img(c)}"><b>${c.name}</b><div>${x.return?'返す':'KEEP'}</div>`;s.onclick=()=>{hand[i].return=!hand[i].return;renderHand()};s.oncontextmenu=e=>{e.preventDefault();hand.splice(i,1);renderHand();renderPicker()}}else s.innerHTML='<span class="muted">カードを選択</span>';handEl.appendChild(s)}}
function renderPicker(){const q=search.value.trim().toLowerCase();picker.innerHTML='';cards.filter(c=>(c.name||'').toLowerCase().includes(q)).forEach(c=>{const used=handCount(c.id),b=document.createElement('button');b.className='pick';b.disabled=hand.length>=4||used>=c.deckCount;b.innerHTML=`<img loading="lazy" src="${img(c)}"><span>${c.name}</span><i class="badge">${used}/${c.deckCount}</i>`;b.onclick=()=>{hand.push({id:c.id,return:false});renderHand();renderPicker()};picker.appendChild(b)})}search.oninput=renderPicker;
save.onclick=()=>{if(!selectedOpponent||!first.value||hand.length!==4){alert('対面クラス・先攻後攻・初期手札4枚を入力してください。');return}records.push({id:Date.now(),opponent:selectedOpponent,first:first.value,win:win.value||null,hand:hand.map(x=>x.id),kept:hand.filter(x=>!x.return).map(x=>x.id),createdAt:new Date().toISOString()});store[deck.id]=records;localStorage.setItem(KEY,JSON.stringify(store));hand=[];renderHand();renderPicker();renderHistory();renderResults();alert('マリガンを登録しました')};
function renderHistory(){history.innerHTML='<h2>登録履歴</h2>'+(!records.length?'<p class="muted">まだ登録がありません。</p>':records.slice().reverse().slice(0,20).map(r=>`<div>${new Date(r.createdAt).toLocaleString()}　${r.opponent} / ${r.first==='first'?'先攻':'後攻'} / KEEP ${r.kept.length}枚 / ${r.win==='win'?'勝ち':r.win==='lose'?'負け':'勝敗未入力'}</div>`).join(''))}
function filteredRecords(){const opp=document.getElementById('dataOpponent')?.value||'',firstFilter=document.getElementById('dataFirst')?.value||'';return records.filter(r=>(!opp||r.opponent===opp)&&(!firstFilter||r.first===firstFilter))}function statsFor(rs){const s={};cards.forEach(c=>s[c.id]={id:c.id,name:c.name,seen:0,kept:0});rs.forEach(r=>{r.hand.forEach(id=>{if(s[id])s[id].seen++});r.kept.forEach(id=>{if(s[id])s[id].kept++})});return Object.values(s).filter(x=>x.seen).map(x=>({...x,rate:x.kept/x.seen})).sort((a,b)=>b.rate-a.rate||b.seen-a.seen)}function rankHtml(arr){return arr.length?arr.map((x,i)=>{const c=byId[x.id];return `<div class="rank"><b>#${i+1}</b>${c?`<img src="${img(c)}" alt="">`:''}<span>${x.name}</span><span>${(x.rate*100).toFixed(1)}%</span><span>${x.kept}/${x.seen}回</span></div>`}).join(''):'<p class="muted">データがありません。</p>'}
function renderResults(){const rs=filteredRecords();ranking.innerHTML=rankHtml(statsFor(rs));winRanking.innerHTML=rankHtml(statsFor(rs.filter(r=>r.win==='win')));filterSummary.textContent=`対象 ${rs.length}戦 / 全${records.length}戦`;const old=pairCard.value;pairCard.innerHTML='<option value="">カードを選択</option>'+cards.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');if([...pairCard.options].some(o=>o.value===old))pairCard.value=old;renderPairs()}function renderPairs(){const id=pairCard.value,rs=filteredRecords();if(!id){pairs.innerHTML='<p class="muted">カードを選ぶと、一緒にキープされたカードを表示します。</p>';return}const m={};rs.forEach(r=>{if(r.kept.includes(id))r.kept.filter(x=>x!==id).forEach(x=>m[x]=(m[x]||0)+1)});pairs.innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([x,n])=>{const c=byId[x];return `<div class="pair-row">${c?`<img src="${img(c)}" alt="">`:''}<span>${c?.name||x}</span><b>${n}回</b></div>`).join('')||'<p class="muted">同時キープのデータがありません。</p>'}pairCard.onchange=renderPairs;dataOpponent.onchange=renderResults;dataFirst.onchange=renderResults;
entryTab.onclick=()=>{entry.classList.remove('hidden');results.classList.add('hidden');entryTab.classList.add('active');resultTab.classList.remove('active')};resultTab.onclick=()=>{results.classList.remove('hidden');entry.classList.add('hidden');resultTab.classList.add('active');entryTab.classList.remove('active');renderResults()};init();
</script></body></html>
