<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デッキ選択</title>
  <link rel="stylesheet" href="style/style.css" />
<style>

/* =========================================================
   Ver2.6 fix: class icon layout normalization
   - all class buttons are centered
   - SVGs never overflow their frames
   - button groups wrap inside panels instead of spilling out
========================================================= */
.class-button-group,
#classButtons,
#class-buttons,
.class-buttons {
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: center !important;
  justify-content: flex-start !important;
  gap: 14px !important;
  margin: 10px 0 22px !important;
  overflow: visible !important;
}

.class-button,
#classButtons button,
#class-buttons button,
.class-buttons button {
  width: 88px !important;
  height: 74px !important;
  min-width: 88px !important;
  min-height: 74px !important;
  max-width: 88px !important;
  max-height: 74px !important;
  box-sizing: border-box !important;
  padding: 8px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  vertical-align: middle !important;
  overflow: hidden !important;
  border-radius: 18px !important;
  line-height: 1 !important;
}

.class-button img,
.class-button svg,
#classButtons button img,
#classButtons button svg,
#class-buttons button img,
#class-buttons button svg,
.class-buttons button img,
.class-buttons button svg,
#classButtons .class-icon,
#class-buttons .class-icon,
.class-buttons .class-icon {
  width: 58px !important;
  height: 58px !important;
  max-width: 58px !important;
  max-height: 58px !important;
  display: block !important;
  margin: auto !important;
  object-fit: contain !important;
  flex: 0 0 auto !important;
  position: static !important;
  transform: none !important;
}

/* small icons used in list/table headers */
.class-chip,
.icon,
.deck-title img.icon,
img.icon {
  display: inline-block !important;
  object-fit: contain !important;
  vertical-align: middle !important;
  flex: 0 0 auto !important;
}

/* prevent top-level panels from clipping contents unexpectedly */
#inputArea,
#summary,
#totalStats,
#recentStats,
#chartContainer,
.section,
.field,
.deck,
.bo1-card {
  box-sizing: border-box !important;
  max-width: 100% !important;
}

@media (max-width: 560px) {
  .class-button,
  #classButtons button,
  #class-buttons button,
  .class-buttons button {
    width: 72px !important;
    height: 64px !important;
    min-width: 72px !important;
    min-height: 64px !important;
    max-width: 72px !important;
    max-height: 64px !important;
    padding: 7px !important;
  }
  .class-button img,
  .class-button svg,
  #classButtons button img,
  #classButtons button svg,
  #class-buttons button img,
  #class-buttons button svg,
  .class-buttons button img,
  .class-buttons button svg,
  #classButtons .class-icon,
  #class-buttons .class-icon,
  .class-buttons .class-icon {
    width: 46px !important;
    height: 46px !important;
    max-width: 46px !important;
    max-height: 46px !important;
  }
}
</style>
</head>
<body>
  <h1>デッキ選択</h1>

  <div class="top-right-actions">
    <button class="bo1-link" onclick="location.href='bo1_list.html'">2デッキBo1はこちら</button>
  </div>

  <div id="deckList"></div>

  <div class="new-deck">
    <button onclick="goToRegister()">新しいデッキを登録する</button>
  </div>

  <!-- 画像拡大用モーダル -->
  <div id="imageLightbox" class="image-lightbox" aria-hidden="true">
    <div class="image-lightbox__backdrop" data-close></div>
    <div class="image-lightbox__content">
      <button class="image-lightbox__close" title="閉じる" data-close>×</button>
      <img id="lightboxImg" src="" alt="デッキ画像拡大" />
    </div>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem('shadowverseData') || '{}');
    const decks = data.decks || [];
    const container = document.getElementById('deckList');

    if (decks.length === 0) {
      container.innerHTML = '<p>登録されたデッキがありません。</p>';
    } else {
      decks.forEach(deck => {
        const div = document.createElement('div');
        div.className = 'deck';

        div.innerHTML = `
          <h3 class="deck-title">
            <img src="images/${getClassIconFilename(deck.class)}" alt="${deck.class}" class="class-chip">
            <span class="deck-name">${deck.name}</span>
          </h3>

          ${deck.url ? `
            <div class="thumb">
              <img src="${deck.url}" alt="デッキ画像" data-zoomable>
            </div>` : ''
          }

          ${deck.memo ? `<p class="deck-memo">${deck.memo}</p>` : ''}

          <div class="button-group">
            <div class="left">
              <button onclick="selectDeck('${deck.id}')">このデッキを選択</button>
              <button onclick="editDeck('${deck.id}')">編集</button>
            </div>
            <div class="right">
              <button class="danger" onclick="deleteDeck('${deck.id}')">削除</button>
            </div>
          </div>
        `;

        container.appendChild(div);
      });
    }

    function selectDeck(id) {
      const data = JSON.parse(localStorage.getItem('shadowverseData') || '{}');
      data.selectedDeckId = id;
      localStorage.setItem('shadowverseData', JSON.stringify(data));
      location.href = 'battle.html';
    }

    function editDeck(id) {
      localStorage.setItem('editDeckId', id);
      location.href = 'deck_edit.html';
    }

    function goToRegister() {
      location.href = 'deck_register.html';
    }

    function getClassIconFilename(className) {
      const map = {
        "エルフ": "elf.svg",
        "ロイヤル": "royal.svg",
        "ウィッチ": "witch.svg",
        "ドラゴン": "dragon.svg",
        "ナイトメア": "nightmare.svg",
        "ビショップ": "bishop.svg",
        "ネメシス": "nemesis.svg"
      };
      return map[className] || "unknown.svg";
    }

    function deleteDeck(id) {
      if (!confirm('このデッキを削除してもよろしいですか？')) return;

      const data = JSON.parse(localStorage.getItem('shadowverseData') || '{}');
      data.decks = data.decks.filter(d => d.id !== id);

      if (data.selectedDeckId === id) {
        delete data.selectedDeckId;
      }

      localStorage.setItem('shadowverseData', JSON.stringify(data));
      location.reload();
    }

    // === 画像拡大（ライトボックス） ===
    const lightbox = document.getElementById('imageLightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    // サムネイルクリックで拡大
    document.addEventListener('click', (e) => {
      const img = e.target.closest('img[data-zoomable]');
      if (!img) return;
      lightboxImg.src = img.src;
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('no-scroll');
    });

    // 背景or×で閉じる
    lightbox.addEventListener('click', (e) => {
      if (e.target.hasAttribute('data-close') || e.target === lightbox) {
        closeLightbox();
      }
    });

    // Escで閉じる
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.getAttribute('aria-hidden') === 'false') {
        closeLightbox();
      }
    });

    function closeLightbox() {
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImg.src = '';
      document.body.classList.remove('no-scroll');
    }
  </script>
</body>
</html>
