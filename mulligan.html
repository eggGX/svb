<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マリガン研究</title><link rel="stylesheet" href="style/style.css"><style>
.wrap{width:min(1450px,calc(100% - 30px));margin:auto}.top,.tabs,.row{display:flex;gap:12px;flex-wrap:wrap}.top{justify-content:space-between;align-items:center}.panel{background:rgba(10,18,48,.94);border:1px solid #9b8247;border-radius:14px;padding:18px;margin:14px 0}.tabs button.active{outline:2px solid #e9c76a}.field{flex:1;min-width:210px}.field select{width:100%}.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.slot{min-height:170px;border:1px dashed #6f85bd;border-radius:10px;padding:8px;text-align:center;cursor:pointer}.slot img{width:100%;max-height:180px;object-fit:contain}.slot.keep{outline:3px solid #71df9a;background:rgba(40,120,70,.2)}.deckpicker{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;max-height:520px;overflow:auto;margin-top:12px}.pick{position:relative;background:#081024;border:1px solid #5573ad;padding:5px;cursor:pointer;color:#fff}.pick:disabled{opacity:.35}.pick img{width:100%;display:block}.pick span{display:block;font-size:.78rem;text-align:center}.badge{position:absolute;right:5px;top:5px;background:#050914;border:1px solid #e9c76a;padding:2px 6px}.rank{display:grid;grid-template-columns:60px minmax(180px,1fr) 110px 110px;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #26345e}.muted{opacity:.75}.hidden{display:none!important}@media(max-width:900px){.deckpicker{grid-template-columns:repeat(5,1fr)}.hand{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div><h1>マリガン研究</h1><div id="deckName"></div></div><button onclick="location.href='battle.html'">戦績登録へ戻る</button></div><div class="tabs"><button id="entryTab" class="active">マリガン登録</button><button id="resultTab">研究結果</button></div>
<section id="entry"><div class="panel"><div class="row"><div class="field"><h3>対面のクラス</h3><select id="opp"><option value="">選択してください</option><option>エルフ</option><option>ロイヤル</option><option>ウィッチ</option><option>ドラゴン</option><option>ナイトメア</option><option>ビショップ</option><option>ネメシス</option></select></div><div class="field"><h3>先攻 / 後攻</h3><select id="first"><option value="">選択してください</option><option value="first">先攻</option><option value="second">後攻</option></select></div><div class="field"><h3>勝敗（任意）</h3><select id="win"><option value="">未入力</option><option value="win">勝ち</option><option value="lose">負け</option></select></div></div></div>
<div class="panel"><h2>初期手札 4枚</h2><p class="muted">下のデッキから4枚選択します。選択した手札をクリックすると KEEP / 返す を切り替え、右クリックで手札から外せます。</p><div id="hand" class="hand"></div></div><div class="panel"><h2>デッキ内カード</h2><input id="search" placeholder="カード名で検索"><div id="picker" class="deckpicker"></div></div><button id="save">このマリガンを登録</button><div id="history" class="panel"></div></section>
<section id="results" class="hidden"><div class="panel"><h2>カードのキープ率ランキング</h2><p class="muted">初期手札に来た回数に対して、そのカードをキープした割合です。</p><div id="ranking"></div></div><div class="panel"><h2>勝利時にキープ率が高いカード</h2><div id="winRanking"></div></div><div class="panel"><h2>カード別・一緒にキープされるカード</h2><select id="pairCard"></select><div id="pairs"></div></div></section></div><script src="js/card_deck.js"></script><script>
const data=JSON.parse(localStorage.getItem('shadowverseData')||'{}'),deck=(data.decks||[]).find(d=>d.id===data.selectedDeckId&&d.environmentId===data.currentEnvironmentId);if(!deck||deck.deckType!=='builder'||!Array.isArray(deck.cards)){alert('マリガン研究はデッキ作成機能で登録したデッキのみ利用できます。');location.href='battle.html'}
const KEY='shadowverseMulliganResearchV1';let store=JSON.parse(localStorage.getItem(KEY)||'{}'),records=store[deck.id]||[],cards=[],byId={},hand=[];deckName.textContent=deck.name||'選択中のデッキ';
async function init(){const loaded=await CardDeckAPI.loadCards();byId=Object.fromEntries(loaded.cards.map(c=>[c.id,c]));cards=deck.cards.map(x=>({...(byId[x.cardId]||{id:x.cardId,name:x.cardId}),deckCount:Number(x.count)||0})).filter(c=>c.deckCount);renderHand();renderPicker();renderHistory();renderResults()}
function img(c){return CardDeckAPI.cardImage(c)}function handCount(id){return hand.filter(x=>x.id===id).length}function renderHand(){handEl=document.getElementById('hand');handEl.innerHTML='';for(let i=0;i<4;i++){const x=hand[i],s=document.createElement('div');s.className='slot'+(x?.keep?' keep':'');if(x){const c=byId[x.id]||x;s.innerHTML=`<img src="${img(c)}"><b>${c.name}</b><div>${x.keep?'KEEP':'返す'}</div>`;s.onclick=()=>{hand[i].keep=!hand[i].keep;renderHand()};s.oncontextmenu=e=>{e.preventDefault();hand.splice(i,1);renderHand();renderPicker()}}else s.innerHTML='<span class="muted">カードを選択</span>';handEl.appendChild(s)}}
function renderPicker(){const q=search.value.trim().toLowerCase();picker.innerHTML='';cards.filter(c=>(c.name||'').toLowerCase().includes(q)).forEach(c=>{const used=handCount(c.id),b=document.createElement('button');b.className='pick';b.disabled=hand.length>=4||used>=c.deckCount;b.innerHTML=`<img loading="lazy" src="${img(c)}"><span>${c.name}</span><i class="badge">${used}/${c.deckCount}</i>`;b.onclick=()=>{hand.push({id:c.id,keep:false});renderHand();renderPicker()};picker.appendChild(b)})}search.oninput=renderPicker;
save.onclick=()=>{if(!opp.value||!first.value||hand.length!==4){alert('対面クラス・先攻後攻・初期手札4枚を入力してください。');return}records.push({id:Date.now(),opponent:opp.value,first:first.value,win:win.value||null,hand:hand.map(x=>x.id),kept:hand.filter(x=>x.keep).map(x=>x.id),createdAt:new Date().toISOString()});store[deck.id]=records;localStorage.setItem(KEY,JSON.stringify(store));hand=[];renderHand();renderPicker();renderHistory();renderResults();alert('マリガンを登録しました')};
function renderHistory(){history.innerHTML='<h2>登録履歴</h2>'+(!records.length?'<p class="muted">まだ登録がありません。</p>':records.slice().reverse().slice(0,20).map(r=>`<div>${new Date(r.createdAt).toLocaleString()}　${r.opponent} / ${r.first==='first'?'先攻':'後攻'} / KEEP ${r.kept.length}枚 / ${r.win==='win'?'勝ち':r.win==='lose'?'負け':'勝敗未入力'}</div>`).join(''))}
function statsFor(rs){const s={};cards.forEach(c=>s[c.id]={id:c.id,name:c.name,seen:0,kept:0});rs.forEach(r=>{r.hand.forEach(id=>{if(s[id])s[id].seen++});r.kept.forEach(id=>{if(s[id])s[id].kept++})});return Object.values(s).filter(x=>x.seen).map(x=>({...x,rate:x.kept/x.seen})).sort((a,b)=>b.rate-a.rate||b.seen-a.seen)}function rankHtml(arr){return arr.length?arr.map((x,i)=>`<div class="rank"><b>#${i+1}</b><span>${x.name}</span><span>${(x.rate*100).toFixed(1)}%</span><span>${x.kept}/${x.seen}回</span></div>`).join(''):'<p class="muted">データがありません。</p>'}
function renderResults(){ranking.innerHTML=rankHtml(statsFor(records));winRanking.innerHTML=rankHtml(statsFor(records.filter(r=>r.win==='win')));pairCard.innerHTML='<option value="">カードを選択</option>'+cards.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');renderPairs()}function renderPairs(){const id=pairCard.value;if(!id){pairs.innerHTML='<p class="muted">カードを選ぶと、一緒にキープされたカードを表示します。</p>';return}const m={};records.forEach(r=>{if(r.kept.includes(id))r.kept.filter(x=>x!==id).forEach(x=>m[x]=(m[x]||0)+1)});pairs.innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([x,n])=>`<div>${byId[x]?.name||x}　<b>${n}回</b></div>`).join('')||'<p class="muted">同時キープのデータがありません。</p>'}pairCard.onchange=renderPairs;
entryTab.onclick=()=>{entry.classList.remove('hidden');results.classList.add('hidden');entryTab.classList.add('active');resultTab.classList.remove('active')};resultTab.onclick=()=>{results.classList.remove('hidden');entry.classList.add('hidden');resultTab.classList.add('active');entryTab.classList.remove('active');renderResults()};init();
</script></body></html>
