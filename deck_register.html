<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デッキ登録</title>
  <link rel="stylesheet" href="style/style.css" />
<style>

/* =========================================================
   Ver2.6 fix: class icon layout normalization
   - all class buttons are centered
   - SVGs never overflow their frames
   - button groups wrap inside panels instead of spilling out
========================================================= */
.class-button-group,
#classButtons,
#class-buttons,
.class-buttons {
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: center !important;
  justify-content: flex-start !important;
  gap: 14px !important;
  margin: 10px 0 22px !important;
  overflow: visible !important;
}

.class-button,
#classButtons button,
#class-buttons button,
.class-buttons button {
  width: 88px !important;
  height: 74px !important;
  min-width: 88px !important;
  min-height: 74px !important;
  max-width: 88px !important;
  max-height: 74px !important;
  box-sizing: border-box !important;
  padding: 8px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  vertical-align: middle !important;
  overflow: hidden !important;
  border-radius: 18px !important;
  line-height: 1 !important;
}

.class-button img,
.class-button svg,
#classButtons button img,
#classButtons button svg,
#class-buttons button img,
#class-buttons button svg,
.class-buttons button img,
.class-buttons button svg,
#classButtons .class-icon,
#class-buttons .class-icon,
.class-buttons .class-icon {
  width: 58px !important;
  height: 58px !important;
  max-width: 58px !important;
  max-height: 58px !important;
  display: block !important;
  margin: auto !important;
  object-fit: contain !important;
  flex: 0 0 auto !important;
  position: static !important;
  transform: none !important;
}

/* small icons used in list/table headers */
.class-chip,
.icon,
.deck-title img.icon,
img.icon {
  display: inline-block !important;
  object-fit: contain !important;
  vertical-align: middle !important;
  flex: 0 0 auto !important;
}

/* prevent top-level panels from clipping contents unexpectedly */
#inputArea,
#summary,
#totalStats,
#recentStats,
#chartContainer,
.section,
.field,
.deck,
.bo1-card {
  box-sizing: border-box !important;
  max-width: 100% !important;
}

@media (max-width: 560px) {
  .class-button,
  #classButtons button,
  #class-buttons button,
  .class-buttons button {
    width: 72px !important;
    height: 64px !important;
    min-width: 72px !important;
    min-height: 64px !important;
    max-width: 72px !important;
    max-height: 64px !important;
    padding: 7px !important;
  }
  .class-button img,
  .class-button svg,
  #classButtons button img,
  #classButtons button svg,
  #class-buttons button img,
  #class-buttons button svg,
  .class-buttons button img,
  .class-buttons button svg,
  #classButtons .class-icon,
  #class-buttons .class-icon,
  .class-buttons .class-icon {
    width: 46px !important;
    height: 46px !important;
    max-width: 46px !important;
    max-height: 46px !important;
  }
}
</style>
</head>

<body>
  <h1>デッキ登録</h1>

  <div class="class-buttons">
    <h3>クラス選択</h3>
    <div id="classButtons"></div>
  </div>

  <div>
    <h3>デッキ名</h3>
    <input type="text" id="deckName" placeholder="例: ミッドレンジロイヤル" />

    <h3>デッキ画像URL</h3>
    <div style="margin-top: 20px;">
      <button onclick="window.open('https://shadowverse-wb.com/ja/deck/build/')">デッキ作成はこちら</button>
    </div>
    <input type="text" id="deckUrl" placeholder="画像のURLを入力してください" oninput="updateImage()" />
    <div id="imagePreview"></div>

    <h3>メモ</h3>
    <textarea id="deckMemo" rows="4" placeholder="自由記述欄"></textarea>
  </div>

  <button onclick="registerDeck()">デッキを登録</button>
  <button onclick="goToSelect()">デッキ選択へ</button>

  <script>
    const data = JSON.parse(localStorage.getItem('shadowverseData') || '{}');
    const currentEnvironmentId = data.currentEnvironmentId;
    const currentEnvironment = (data.environments || []).find(env => env.id === currentEnvironmentId);

    if (!currentEnvironmentId || !currentEnvironment) {
      alert('環境が選択されていません。環境選択画面に戻ります。');
      location.href = 'environment_select.html';
    }

    const classIcons = {
      'エルフ': 'images/elf.svg',
      'ロイヤル': 'images/royal.svg',
      'ウィッチ': 'images/witch.svg',
      'ドラゴン': 'images/dragon.svg',
      'ナイトメア': 'images/nightmare.svg',
      'ビショップ': 'images/bishop.svg',
      'ネメシス': 'images/nemesis.svg'
    };

    let selectedClass = null;
    const classButtonsContainer = document.getElementById('classButtons');

    Object.entries(classIcons).forEach(([cls, imgPath]) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<img src="${imgPath}" alt="${cls}" title="${cls}" class="class-icon" />`;
      btn.onclick = () => {
        selectedClass = cls;
        [...classButtonsContainer.children].forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
      classButtonsContainer.appendChild(btn);
    });

    function updateImage() {
      const url = document.getElementById('deckUrl').value;
      const container = document.getElementById('imagePreview');
      container.innerHTML = '';
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        container.appendChild(img);
      }
    }

    function registerDeck() {
      const name = document.getElementById('deckName').value.trim();
      const url = document.getElementById('deckUrl').value.trim();
      const memo = document.getElementById('deckMemo').value.trim();

      if (!selectedClass || !name) {
        alert('クラスとデッキ名は必須です');
        return;
      }

      const data = JSON.parse(localStorage.getItem('shadowverseData') || '{}');
      if (!data.decks) data.decks = [];

      const id = 'deck-' + Date.now();
      data.decks.push({ id, environmentId: currentEnvironmentId, class: selectedClass, name, url, memo, records: [] });

      data.selectedDeckId = id;
      localStorage.setItem('shadowverseData', JSON.stringify(data));

      location.href = 'deck_select.html';
    }

    function goToSelect() {
      location.href = 'deck_select.html';
    }
  </script>
</body>

</html>
