<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style/style.css"><title>デッキ登録</title></head><body>
<h1>デッキ登録</h1><div class="class-buttons"><h3>クラス選択</h3><div id="classButtons"></div></div>
<h3>デッキ名</h3><input id="deckName" placeholder="例: ミッドレンジロイヤル">
<h3>登録方法</h3><div class="deck-source-tabs"><button id="urlTab" class="active">画像URLで登録</button><button id="builderTab">カード40枚で作成</button></div>
<section id="urlPanel"><div><button onclick="window.open('https://shadowverse-wb.com/ja/deck/build/')">公式デッキ作成はこちら</button></div><input id="deckUrl" placeholder="デッキ画像URL" oninput="updateImage()"><div id="imagePreview"></div></section>
<section id="builderPanel" class="builder-panel" hidden><div id="loadState">カードデータを読み込み中...</div><div class="builder-status" id="builderStatus">0 / 40枚</div><div class="builder-toolbar"><input id="cardSearch" placeholder="カード名・能力で検索"><select id="packFilter"><option value="">全パック</option></select><select id="classFilter"><option value="">全クラス</option></select><select id="costFilter"><option value="">全コスト</option></select><select id="typeFilter"><option value="">全タイプ</option></select></div><div id="selectedCards" class="deck-selected-list"></div><div id="cardGrid" class="card-picker-grid"></div></section>
<h3>メモ</h3><textarea id="deckMemo" rows="4" placeholder="自由記述欄"></textarea><br><button id="saveBtn">デッキを登録</button><button onclick="location.href='deck_select.html'">デッキ選択へ</button>
<script src="js/card_deck.js"></script><script>
const data=JSON.parse(localStorage.getItem('shadowverseData')||'{}'); const envId=data.currentEnvironmentId; const env=(data.environments||[]).find(e=>e.id===envId); if(!env) location.href='environment_select.html';
const icons={'エルフ':'elf.svg','ロイヤル':'royal.svg','ウィッチ':'witch.svg','ドラゴン':'dragon.svg','ナイトメア':'nightmare.svg','ビショップ':'bishop.svg','ネメシス':'nemesis.svg'}; let selectedClass=null, mode='url', allCards=[],packNames={},selected={};
const cb=document.getElementById('classButtons'); Object.entries(icons).forEach(([c,f])=>{const b=document.createElement('button');b.innerHTML=`<img src="images/${f}" class="class-icon" title="${c}">`;b.onclick=()=>{selectedClass=c;[...cb.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');renderCards()};cb.appendChild(b)});
urlTab.onclick=()=>setMode('url'); builderTab.onclick=()=>setMode('builder'); function setMode(m){mode=m;urlPanel.hidden=m!=='url';builderPanel.hidden=m!=='builder';urlTab.classList.toggle('active',m==='url');builderTab.classList.toggle('active',m==='builder')}
function updateImage(){imagePreview.innerHTML=deckUrl.value?`<img src="${deckUrl.value}">`:''}
CardDeckAPI.loadCards().then(x=>{allCards=x.cards;packNames=x.packNames;loadState.textContent=`${allCards.length}枚読み込み済み`; Object.entries(packNames).forEach(([v,n])=>packFilter.add(new Option(n,v))); [...new Set(allCards.map(c=>c.class))].filter(Boolean).sort().forEach(v=>classFilter.add(new Option(v,v))); [...new Set(allCards.map(c=>c.cost))].sort((a,b)=>a-b).forEach(v=>costFilter.add(new Option(v,v))); [...new Set(allCards.map(c=>c.type))].filter(Boolean).sort().forEach(v=>typeFilter.add(new Option(v,v))); renderCards()}).catch(e=>loadState.textContent='カードデータを読み込めませんでした。GitHub Pages等のHTTP環境で開いてください。');
[cardSearch,packFilter,classFilter,costFilter,typeFilter].forEach(e=>e.addEventListener('input',renderCards));
function total(){return Object.values(selected).reduce((a,b)=>a+b,0)} function change(id,d){const n=Math.max(0,Math.min(3,(selected[id]||0)+d));if(d>0&&total()>=40)return;if(n)selected[id]=n;else delete selected[id];renderCards();renderSelected()}
function renderSelected(){builderStatus.textContent=`${total()} / 40枚`;builderStatus.classList.toggle('full',total()===40);selectedCards.innerHTML='';Object.entries(selected).forEach(([id,n])=>{const c=allCards.find(x=>x.id===id);if(!c)return;const d=document.createElement('div');d.className='deck-selected-chip';d.innerHTML=`<span>${c.name} ×${n}</span><button type="button">−</button>`;d.querySelector('button').onclick=()=>change(id,-1);selectedCards.appendChild(d)})}
function renderCards(){if(!allCards.length)return;const q=cardSearch.value.trim().toLowerCase();let arr=allCards.filter(c=>(!q||(`${c.name} ${c.effect||''}`).toLowerCase().includes(q)))&&(!packFilter.value||c.pack===packFilter.value)&&(!classFilter.value||c.class===classFilter.value)&&(!costFilter.value||String(c.cost)===costFilter.value)&&(!typeFilter.value||c.type===typeFilter.value)&&(!selectedClass||c.class===selectedClass||c.class==='ニュートラル'));arr.sort((a,b)=>a.cost-b.cost||a.name.localeCompare(b.name,'ja'));cardGrid.innerHTML='';arr.forEach(c=>{const n=selected[c.id]||0,d=document.createElement('button');d.type='button';d.className='card-picker'+(n?' selected':'')+(n>=3?' maxed':'');d.innerHTML=`<img src="${CardDeckAPI.cardImage(c)}"><span class="cp-count">${n}</span><div class="cp-name">${c.cost}PP ${c.name}</div>`;d.onclick=()=>change(c.id,1);d.oncontextmenu=e=>{e.preventDefault();change(c.id,-1)};cardGrid.appendChild(d)})}
saveBtn.onclick=()=>{const name=deckName.value.trim(),memo=deckMemo.value.trim();if(!selectedClass||!name)return alert('クラスとデッキ名は必須です');if(mode==='builder'&&total()!==40)return alert('カードを合計40枚選択してください');const d=JSON.parse(localStorage.getItem('shadowverseData')||'{}');d.decks=d.decks||[];const id='deck-'+Date.now();const deck={id,environmentId:envId,class:selectedClass,name,memo,records:[],deckType:mode==='builder'?'builder':'image',url:mode==='url'?deckUrl.value.trim():'',cards:mode==='builder'?Object.entries(selected).map(([cardId,count])=>({cardId,count})):[]};d.decks.push(deck);d.selectedDeckId=id;localStorage.setItem('shadowverseData',JSON.stringify(d));location.href='deck_select.html'};
</script></body></html>
