<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>環境選択</title>
  <link rel="stylesheet" href="style/style.css?v=2.7.7" />

  <style>
    /* Ver2.7.7: 環境選択カードのサイズ固定 */
    #environmentList.environment-list {
      width: min(1100px, calc(100% - 24px));
      margin: 22px auto;
      display: grid !important;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      padding: 0 !important;
    }
    .environment-select-card {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(233,199,106,.45);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(22,29,72,.88), rgba(8,12,30,.88));
      box-shadow: 0 0 18px rgba(233,199,106,.18), 0 14px 30px rgba(0,0,0,.35);
      box-sizing: border-box;
    }
    .environment-image-button {
      width: 100% !important;
      aspect-ratio: 16 / 9;
      height: auto !important;
      min-height: 0 !important;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      box-sizing: border-box;
    }
    .environment-image-button img {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      display: block !important;
    }
    @media (max-width: 1024px) {
      #environmentList.environment-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      #environmentList.environment-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .environment-select-card { padding: 8px; }
    }
  </style>
</head>
<body>
  <h1>環境選択</h1>
  <p class="hint">使用する環境を選択してください。選択した環境ごとにデッキ・BO1データ・戦績が分かれます。</p>

  <div id="migrationNotice" class="migration-notice" style="display:none;"></div>
  <div id="environmentList" class="environment-list"></div>

  <div class="new-deck">
    <button onclick="location.href='index.html'">TOPへ戻る</button>
  </div>

  <script src="js/environment_loader.js"></script>
  <script>
    init();

    async function init() {
      const data = await EnvironmentLoader.ensureFileEnvironments();
      // 最新環境を左上に表示するため、登録順/JSON記述順を逆順にして表示します。
      // environments.json は「古い → 新しい」の順に書けば、画面では「新しい → 古い」になります。
      const environments = (data.environments || []).slice().reverse();
      const container = document.getElementById('environmentList');
      const migrationNotice = document.getElementById('migrationNotice');

      if (EnvironmentLoader.hasUnassignedData(data)) {
        migrationNotice.style.display = 'block';
        migrationNotice.innerHTML = `
          <strong>環境未設定の既存データがあります。</strong>
          <span>以前から使っていたデッキ・戦績を環境に割り当てできます。</span>
          <button type="button" onclick="location.href='environment_migration.html'">既存データを環境に移行</button>
        `;
      }

      if (environments.length === 0) {
        container.innerHTML = '<p>登録された環境がありません。先に environment_register.html から環境を登録してください。</p>';
        return;
      }

      environments.forEach(env => {
        const card = document.createElement('div');
        card.className = 'environment-select-card';
        card.innerHTML = `
          <button class="environment-image-button" type="button" onclick="selectEnvironment('${escapeJs(env.id)}')" aria-label="${escapeHtml(env.title)}でスタート">
            ${env.image ? `<img src="${escapeAttr(env.image)}" alt="${escapeHtml(env.title)}">` : '<span class="no-image">NO IMAGE</span>'}
          </button>
          <h3 class="deck-title environment-title-only">${escapeHtml(env.title)}</h3>
        `;
        container.appendChild(card);
      });
    }

    function selectEnvironment(id) {
      const latest = EnvironmentLoader.readData();
      latest.currentEnvironmentId = id;
      delete latest.selectedDeckId;
      EnvironmentLoader.writeData(latest);
      location.href = 'deck_select.html';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }
    function escapeJs(value) {
      return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
